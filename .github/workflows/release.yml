name: Release

# A vX.Y.Z tag on a commit that is already on main and green becomes a DRAFT
# release: signed images in GHCR, the darkplum CLI for four platforms with the
# release manifest (image digests, repository, this workflow's identity) baked
# in, and a checksums file with its own attestation.
#
# Nothing is published from here. The draft is smoke-tested by a human (see
# darkplum/docs/RELEASING.md) and only then published; docs, the brew tap and
# any announcement wait for that.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is a plain vX.Y.Z on a commit that is on main
        id: v
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "not a vX.Y.Z tag: $REF"; exit 1; }
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SHA" origin/main || { echo "$SHA is not on main: releases are cut from main only"; exit 1; }
      - name: CI is green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/require-ci-green.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA"
      - name: Plumbing tests
        run: |
          python3 -I -m unittest discover -s .github/scripts -p 'test_*.py'

  images:
    name: Images
    needs: gate
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_build-sign.yml
    with:
      channel: release
      image-tag: ${{ needs.gate.outputs.version }}

  cli:
    name: CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [gate, images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - {goos: darwin, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: linux, goarch: amd64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: darkplum/services/cli/go.mod
          cache-dependency-path: darkplum/services/cli/go.sum
      - name: Build
        env:
          DIGESTS: ${{ needs.images.outputs.digests }}
          VERSION: ${{ needs.gate.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          printf '%s' "$DIGESTS" > "$RUNNER_TEMP/digests.json"
          enc="$(python3 -I .github/scripts/release-json.py --base64 \
            --channel release --version "$VERSION" --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" \
            --digests "$RUNNER_TEMP/digests.json")"
          mkdir -p dist/stage
          (cd darkplum/services/cli && CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X github.com/scalecraft-dev/darkplum/cli/internal/release.encoded=$enc" \
            -o "$GITHUB_WORKSPACE/dist/stage/darkplum" ./cmd)
          cp LICENSE NOTICE dist/stage/
          tar -C dist/stage -czf "dist/darkplum_${VERSION}_${GOOS}_${GOARCH}.tar.gz" darkplum LICENSE NOTICE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Draft release
    needs: [gate, images, cli]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Protected environment with a required reviewer: a person approves before a
    # draft carrying signed artifacts exists.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      - name: Checksums and manifest
        env:
          DIGESTS: ${{ needs.images.outputs.digests }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum darkplum_*.tar.gz > checksums.txt)
          printf '%s' "$DIGESTS" > "$RUNNER_TEMP/digests.json"
          python3 -I .github/scripts/release-json.py \
            --channel release --version "$VERSION" --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" \
            --digests "$RUNNER_TEMP/digests.json" > dist/release.json
          cat dist/checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes \
            dist/darkplum_*.tar.gz dist/checksums.txt dist/release.json
