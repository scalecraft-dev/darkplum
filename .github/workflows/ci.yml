name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, api, cli]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dptest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: darkplum/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: darkplum/services/${{ matrix.service }}/go.mod
          cache-dependency-path: darkplum/services/${{ matrix.service }}/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - run: go build ./...
      - run: go vet ./...
      # The vendorsmoke-tagged tests call the real Anthropic and OpenAI APIs and
      # only ever run from the manual Vendor smoke workflow. Compile-check them
      # here (no keys, no network) so they cannot rot unnoticed between runs.
      - if: matrix.service == 'gateway'
        run: go vet -tags vendorsmoke ./...
      # The api and gateway integration tests (migrations, model sync, aliases,
      # service key, audit recorder) run against the Postgres service container;
      # without TEST_DATABASE_URL they would skip silently.
      # Five minutes is several times what any package needs here; a hang
      # (a pool deadlock, say) then fails with a goroutine dump instead of
      # sitting at Go's ten-minute default.
      - run: go test -race -count=1 -timeout 5m ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/dptest?sslmode=disable

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: darkplum/services/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: darkplum/services/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm run build
      # API <-> UI parity: every route the UI calls is in docs/api-routes.json as
      # "ui", every "ui" route is called, machine-only routes carry a reason, and
      # no fetch() lives outside the API client. The Go services run the same
      # golden against their live route tables.
      - run: pnpm run check:parity
      - run: pnpm run check:policy

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: darkplum/terraform/aws
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.9"
          # The default wrapper (a node shim that captures output) does not pass
          # stdin through, so `terraform console` below waits forever. No step
          # reads the wrapper's outputs.
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      # What `darkplum init` writes must be valid Terraform. Render a sample
      # tfvars (hostile profile name included) and backend.tf from the Go code,
      # validate the config with that backend.tf, then check Terraform reads the
      # hostile value back unchanged.
      - uses: actions/setup-go@v5
        with:
          go-version-file: darkplum/services/cli/go.mod
          cache-dependency-path: darkplum/services/cli/go.sum
      - name: terraform validate (rendered init output)
        timeout-minutes: 5
        run: |
          samples="$RUNNER_TEMP/samples"; mkdir -p "$samples"
          (cd ../../services/cli && DARKPLUM_RENDER_SAMPLES="$samples" go test ./internal/commands -run TestWriteRenderedSamples -count=1)
          cp "$samples/backend.tf" backend.tf
          terraform init -backend=false -input=false -reconfigure
          terraform validate
          rm backend.tf
          terraform init -backend=false -input=false -reconfigure
          # Read the value back with the variable declarations only: in the full
          # config, `terraform console` configures the AWS provider, which waits on
          # credential lookups (instance metadata) on a runner with no AWS access.
          vars="$RUNNER_TEMP/vars-only"; mkdir -p "$vars"; cp variables.tf "$vars/"
          got=$(cd "$vars" && echo 'var.aws_profile' | terraform console -var-file="$samples/sample.tfvars")
          want='"we\"ird\\${x}%{y}"'
          [ "$got" = "$want" ] || { echo "tfvars round trip changed the value: got $got want $want"; exit 1; }
      # The Go validators in the CLI and the validation blocks in variables.tf are
      # driven by one fixture table (tests/variable_cases.json).
      - name: terraform test (variable validation)
        run: |
          ./tests/gen_validation_tests.sh > variables.tftest.hcl
          terraform test
          rm variables.tftest.hcl
      # Offline unit tests of the Bedrock IAM allowlist shape (no providers, no AWS).
      - name: terraform test (bedrock-allowlist)
        working-directory: darkplum/terraform/aws/modules/bedrock-allowlist
        run: |
          terraform init -backend=false -input=false
          terraform test
      # The first-party image repositories: per-cluster names, immutable tags,
      # force_delete, lifecycle. Mocked provider, no AWS.
      - name: terraform test (ecr)
        working-directory: darkplum/terraform/aws/modules/ecr
        run: |
          terraform init -backend=false -input=false
          terraform test

  plumbing:
    name: Release plumbing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The release workflows sign what customers deploy: every action in them is
      # pinned to a commit, the manifest writer refuses channel/ref/prefix
      # mix-ups, and the workflow files must at least parse.
      - run: python3 -I -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - run: python3 -I .github/scripts/check-pinned-actions.py
      # The CLI runs terraform with -lockfile=readonly on the customer's machine,
      # so the lock file must cover darwin/linux x arm64/amd64.
      - run: python3 -I .github/scripts/check-lock-platforms.py
      - name: workflows parse
        run: |
          python3 -c 'import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]' .github/workflows/*.yml
      - run: bash -n .github/scripts/require-ci-green.sh

  manifests:
    name: Kubernetes manifests and docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: darkplum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: darkplum/services/api/go.mod
          cache-dependency-path: darkplum/services/api/go.sum
      - uses: azure/setup-kubectl@v4
      - name: kustomize builds
        run: |
          for overlay in dev dev-aws; do
            kubectl kustomize k8s/overlays/$overlay > /dev/null || exit 1
          done
      - name: model template renders
        run: |
          sed -e "s|MODEL_INSTANCE|ci|g" -e "s|PLACEHOLDER_MODEL_NAME|org/model|g" \
              -e "s|PLACEHOLDER_MODEL_REVISION|main|g" -e "s|PLACEHOLDER_SERVED_MODEL_NAME|ci|g" \
              -e "s|PLACEHOLDER_MAX_MODEL_LEN|8192|g" k8s/templates/vllm-model.yaml \
            | python3 -c 'import sys, yaml; docs = list(yaml.safe_load_all(sys.stdin)); assert {d["kind"] for d in docs} == {"Deployment", "Service"}, docs'
      - name: Makefile parses
        run: make -n help > /dev/null
      # Configuration comes from `darkplum init`; no README, docs/*.md or Makefile
      # text may tell a user to copy or hand-edit terraform.tfvars (a deliberate
      # GitOps section sits inside tfvars-manual:begin/end markers).
      - name: docs do not say to copy or edit tfvars
        working-directory: .
        run: python3 -I .github/scripts/check-tfvars-docs.py
      # make deploy must stop before doing any work when init has not run.
      - name: make deploy refuses without terraform.tfvars
        run: |
          empty=$(mktemp -d)
          for target in deploy deploy-infra; do
            if out=$(make "$target" TF_DIR="$empty" 2>&1); then echo "make $target succeeded without tfvars"; exit 1; fi
            echo "$out" | grep -q 'Run ./bin/darkplum init first' || { echo "no init hint from make $target:"; echo "$out"; exit 1; }
            if echo "$out" | grep -qE 'Initializing Terraform|Building darkplum CLI'; then echo "make $target did work before the guard"; exit 1; fi
          done
      - name: API reference is generated from the golden
        working-directory: darkplum/services/api
        run: |
          go run ./cmd/apidoc
          git diff --exit-code -- ../../docs/API.md || { echo "docs/API.md is stale: run 'go run ./cmd/apidoc' in services/api and commit the result"; exit 1; }
