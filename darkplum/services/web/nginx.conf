# Response headers are declared in three places on purpose.
#
# nginx's add_header is *replaced*, not merged, by any add_header in a more
# specific block: a location that adds one header of its own drops every
# header inherited from the server. Before this file said so out loud, the
# static-asset location below added Cache-Control and silently served every
# .js and .css without nosniff. So the security set is repeated verbatim in
# each block that adds a header of its own, and /health takes its content type
# from default_type rather than from an add_header, which keeps it inheriting.
#
# Keep the three copies identical. If one changes, change all of them.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    # --- Content Security Policy -------------------------------------------
    #
    # Verified against the built bundle (services/web/dist) in headless
    # Chromium, page loaded and DOM dumped, console watched for violations:
    #
    #   script-src 'self'     index.html carries no inline <script>; Vite emits
    #                         one external module and a modulepreload link.
    #   style-src  'self'
    #              'unsafe-inline'
    #                         Not optional, and not because of anything in this
    #                         repo. Radix's Dialog locks body scroll through
    #                         react-remove-scroll -> react-style-singleton,
    #                         which does document.createElement('style') and
    #                         appends text to it at runtime. That is an inline
    #                         style element, and 'self' alone blocks it:
    #                         "Applying inline style violates ... 'style-src
    #                         'self''". Its content varies with the measured
    #                         scrollbar width, so there is no stable hash to
    #                         pin, and a nonce would mean generating index.html
    #                         per request. The tighter pair — style-src 'self'
    #                         with style-src-attr 'unsafe-inline' — was tried
    #                         first and fails on exactly that element:
    #                         style-src-attr governs attributes, not elements.
    #                         React's own style prop and Recharts' runtime
    #                         styles go through the CSSOM (element.style), which
    #                         no CSP directive applies to, so they were never
    #                         the reason.
    #   img-src    'self' data:
    #                         One select-chevron SVG is inlined as a data: URL
    #                         in the built CSS.
    #   font-src   'self' data:
    #                         The JetBrains Mono latin subset is inlined as
    #                         data:font/woff2 by the build; the rest are files.
    #                         Without this the monospace face — every ARN, model
    #                         id and key fingerprint in the admin UI — silently
    #                         falls back.
    #   connect-src 'self'    The api is proxied under this origin. Nothing in
    #                         this app talks to a third party, and a key typed
    #                         into the vendor-key form must not be able to
    #                         leave to one.
    #   object-src 'none', base-uri 'none', frame-ancestors 'none',
    #   form-action 'self'    Nothing embeds, plugs into or posts out of this
    #                         app, so say so.
    set $csp "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";

    add_header Content-Security-Policy $csp always;
    # frame-ancestors 'none' above is the modern rule; this is the same answer
    # for a browser that does not read it. DENY, not SAMEORIGIN: the two used
    # to disagree, and nothing in this product frames itself.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    # X-XSS-Protection is gone deliberately: the auditor it was written for no
    # longer exists, no current browser implements it, and the one that did
    # could be turned into a vulnerability by it. The CSP above is the control.
    add_header Referrer-Policy "same-origin" always;

    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        # One Cache-Control, not two. `expires 1y` emits one of its own, which
        # left every asset response carrying two headers that had to be
        # reconciled by whatever read them.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # X-Forwarded-For is SET to the peer nginx saw, never appended to: an
    # appended chain carries whatever the client put there first, and the
    # api's per-IP login limiter and audit ip_address would read that.
    location /api/ {
        proxy_pass http://darkplum-api.darkplum-system.svc.cluster.local:8080;
        proxy_set_header Host $http_host;  # with the port: the api compares it to Origin
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Conversation turns are saved through here after a chat answered
        # through /v1/, so the two caps must agree or long turns are
        # answered and then not saved.
        client_max_body_size 16m;
        error_page 413 = @too_large;
    }

    location /v1/ {
        proxy_pass http://darkplum-api.darkplum-system.svc.cluster.local:8080;
        proxy_set_header Host $http_host;  # with the port: the api compares it to Origin
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        # A chat completion for a long-context model carries megabytes of
        # prompt; nginx's 1m default refused those with an HTML 413. The api
        # and gateway enforce the same 16m, so every hop refuses alike.
        client_max_body_size 16m;
        error_page 413 = @too_large;
    }

    location /auth/ {
        proxy_pass http://darkplum-api.darkplum-system.svc.cluster.local:8080;
        proxy_set_header Host $http_host;  # with the port: the api compares it to Origin
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;
    }

    # Both API surfaces speak JSON errors; nginx's own HTML 413 must not be
    # the one exception an SDK sees.
    location @too_large {
        default_type application/json;
        return 413 '{"error":{"message":"request body too large","type":"invalid_request_error","code":"request_too_large"}}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
