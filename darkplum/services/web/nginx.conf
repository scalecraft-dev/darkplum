# Response headers are declared in three places on purpose.
#
# nginx's add_header is *replaced*, not merged, by any add_header in a more
# specific block: a location that adds one header of its own drops every
# header inherited from the server. Before this file said so out loud, the
# static-asset location below added Cache-Control and silently served every
# .js and .css without nosniff. So the security set is repeated verbatim in
# each block that adds a header of its own, and /health takes its content type
# from default_type rather than from an add_header, which keeps it inheriting.
#
# Keep the three copies identical (they live in site.conf). If one changes,
# change all of them.

# Two servers share site.conf:
#
#   :80    in-cluster: readiness/liveness probes and the operator's
#          port-forward (`darkplum configure`). The peer is the client.
#   :8443  the private HTTPS address. The internal NLB terminates TLS and
#          connects here through NodePort 30080 with a PROXY protocol v2
#          header carrying the browser's address. Every connection must send
#          that header. Which peers may set the client address is listed in
#          /etc/nginx/trusted-proxies/ (set_real_ip_from <NLB /32>), a
#          ConfigMap `darkplum configure` writes from the install's Terraform
#          outputs. Until it exists nothing is trusted: the logged and
#          forwarded address is the NLB's, and no peer can claim another.

server {
    listen 80;
    set $darkplum_proto $scheme;
    include /etc/nginx/darkplum/site.conf;
}

server {
    listen 8443 proxy_protocol;
    include /etc/nginx/trusted-proxies/*.conf;
    real_ip_header proxy_protocol;
    # TLS ends at the load balancer; the browser spoke https.
    set $darkplum_proto https;
    include /etc/nginx/darkplum/site.conf;
}
