apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vllm-inference-ingress
  namespace: darkplum-inference
  labels:
    app.kubernetes.io/part-of: darkplum
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vllm-inference
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: darkplum-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: darkplum-gateway
      ports:
        - protocol: TCP
          port: 8000
