apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vllm-inference-ingress
  namespace: darkplum-inference
  labels:
    app.kubernetes.io/part-of: darkplum
spec:
  # Every self-hosted model backend carries this label (the default
  # vllm-inference deployment and any added with `make deploy-model`), so one
  # policy locks all of them down to gateway-only ingress.
  podSelector:
    matchLabels:
      app.kubernetes.io/component: inference-backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: darkplum-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: darkplum-gateway
      ports:
        - protocol: TCP
          port: 8000
