apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-egress
  namespace: darkplum-system
  labels:
    app.kubernetes.io/name: darkplum-gateway
    app.kubernetes.io/part-of: darkplum
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: darkplum-gateway
  policyTypes:
    - Egress
  egress:
    # DNS — scoped to kube-dns only (not "any destination on :53")
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Outbound HTTPS (Bedrock, OpenAI-compatible upstreams over TLS).
    # IPv4 default-allow EXCEPT link-local — blocks the IMDS SSRF surface
    # (169.254.169.254). No IPv6 allow-rule is present, so all IPv6 egress
    # (including fe80::/10 link-local) is denied by default. `except` entries
    # must share the block's address family, so an fe80::/10 entry cannot live
    # under 0.0.0.0/0 — the Go startup validator covers IPv6 link-local upstreams.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16   # IPv4 link-local (AWS/GCP/Azure IMDS)
      ports:
        - protocol: TCP
          port: 443

    # EKS Pod Identity agent. The gateway's AWS credentials (for Bedrock) are
    # served from this fixed link-local address on the node — NOT from IMDS.
    # The :443 rule above excludes all of 169.254.0.0/16, and the VPC CNI
    # enforces NetworkPolicy on this cluster, so without this rule the AWS SDK
    # can never obtain credentials and every Bedrock model stays unavailable.
    # Only this one address and port is opened; IMDS (169.254.169.254) stays
    # blocked.
    - to:
        - ipBlock:
            cidr: 169.254.170.23/32
      ports:
        - protocol: TCP
          port: 80

    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: darkplum-inference
          podSelector:
            matchLabels:
              app.kubernetes.io/component: inference-backend
      ports:
        - protocol: TCP
          port: 8000

    # Optional in-cluster intent classifier (vLLM Semantic Router) behind
    # routed aliases. Classification only; never inference.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: semantic-router
      ports:
        - protocol: TCP
          port: 8080

    - ports:
        - protocol: TCP
          port: 5432
