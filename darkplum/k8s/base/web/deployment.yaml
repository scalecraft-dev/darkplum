apiVersion: apps/v1
kind: Deployment
metadata:
  name: darkplum-web
  namespace: darkplum-system
  labels:
    app.kubernetes.io/name: darkplum-web
    app.kubernetes.io/part-of: darkplum
spec:
  # Two, on different nodes where possible: with externalTrafficPolicy Local
  # only nodes running a web pod receive NLB traffic, so a single replica
  # would mean an outage whenever its node is replaced.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: darkplum-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: darkplum-web
        app.kubernetes.io/part-of: darkplum
    spec:
      # Static files behind nginx: it never talks to the Kubernetes API, so it
      # gets no ServiceAccount token.
      automountServiceAccountToken: false
      # CPU (system) nodes only: the NLB's targets are the CPU node group.
      # Expressed as "not a GPU node", so a cluster without darkplum's node
      # labels (local kind) schedules it too.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: darkplum.ai/node-type
                    operator: NotIn
                    values: ["gpu-inference"]
      # Hard on the node, counted per ReplicaSet: a roll must not put both new pods on
      # one node, or removing the last old pod leaves the other node with none, and
      # with externalTrafficPolicy Local its share of NLB traffic hangs until the
      # health check notices. Measured: 20 timeouts in 6 restarts when soft, 0 in 8
      # with this. nodeTaintsPolicy keeps a cordoned node from holding a pod Pending.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys: ["pod-template-hash"]
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: darkplum-web
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: darkplum-web
      volumes:
        # set_real_ip_from lines for the NLB's addresses, written by
        # `darkplum configure`. Optional: until it exists nginx on 8443 still
        # requires the PROXY header but trusts no peer to name the client.
        - name: trusted-proxies
          configMap:
            name: darkplum-web-trusted-proxies
            optional: true
      containers:
        - name: web
          image: darkplum-web:latest
          imagePullPolicy: Always  # :latest is mutable; IfNotPresent keeps a node on the old image after darkplum deploy
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https-proxy
              containerPort: 8443
              protocol: TCP
          volumeMounts:
            - name: trusted-proxies
              mountPath: /etc/nginx/trusted-proxies
              readOnly: true
          # Keep serving while the Service stops sending here; the listener otherwise
          # closes on SIGTERM while traffic still arrives. Fits the 30s grace period,
          # with nginx's graceful stop (the image's stop signal is SIGQUIT).
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 100m
