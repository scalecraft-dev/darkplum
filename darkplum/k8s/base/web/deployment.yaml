apiVersion: apps/v1
kind: Deployment
metadata:
  name: darkplum-web
  namespace: darkplum-system
  labels:
    app.kubernetes.io/name: darkplum-web
    app.kubernetes.io/part-of: darkplum
spec:
  # Two, on different nodes where possible: with externalTrafficPolicy Local
  # only nodes running a web pod receive NLB traffic, so a single replica
  # would mean an outage whenever its node is replaced.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: darkplum-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: darkplum-web
        app.kubernetes.io/part-of: darkplum
    spec:
      # Static files behind nginx: it never talks to the Kubernetes API, so it
      # gets no ServiceAccount token.
      automountServiceAccountToken: false
      # CPU (system) nodes only: the NLB's targets are the CPU node group.
      # Expressed as "not a GPU node", so a cluster without darkplum's node
      # labels (local kind) schedules it too.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: darkplum.ai/node-type
                    operator: NotIn
                    values: ["gpu-inference"]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: darkplum-web
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: darkplum-web
      volumes:
        # set_real_ip_from lines for the NLB's addresses, written by
        # `darkplum configure`. Optional: until it exists nginx on 8443 still
        # requires the PROXY header but trusts no peer to name the client.
        - name: trusted-proxies
          configMap:
            name: darkplum-web-trusted-proxies
            optional: true
      containers:
        - name: web
          image: darkplum-web:latest
          imagePullPolicy: Always  # :latest is mutable; IfNotPresent keeps a node on the old image after make deploy-platform
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https-proxy
              containerPort: 8443
              protocol: TCP
          volumeMounts:
            - name: trusted-proxies
              mountPath: /etc/nginx/trusted-proxies
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 100m
