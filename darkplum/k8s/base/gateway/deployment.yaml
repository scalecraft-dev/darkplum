apiVersion: apps/v1
kind: Deployment
metadata:
  name: darkplum-gateway
  namespace: darkplum-system
  labels:
    app.kubernetes.io/name: darkplum-gateway
    app.kubernetes.io/part-of: darkplum
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: darkplum-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: darkplum-gateway
        app.kubernetes.io/part-of: darkplum
    spec:
      serviceAccountName: darkplum-gateway
      containers:
        - name: gateway
          image: darkplum-gateway:latest
          imagePullPolicy: Always  # :latest is mutable; IfNotPresent keeps a node on the old image after make deploy-platform
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: GATEWAY_PORT
              value: "8080"
            - name: VLLM_UPSTREAM
              value: http://vllm-inference.darkplum-inference.svc.cluster.local:8000
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
            - name: BEDROCK_ENABLED
              value: "true"
            - name: BEDROCK_REGION
              value: "us-east-1"
            # Catalog globs for Bedrock models (e.g. "*.anthropic.claude-*").
            # `make deploy-platform` fills this from the Terraform
            # bedrock_model_filter output so the catalog matches the IAM
            # allowlist. Empty = list every discovered inference profile.
            - name: BEDROCK_MODEL_FILTER
              value: ""
            # Additional self-hosted vLLM backends as "name=url,name2=url2".
            # Managed by `make deploy-model` / `make remove-model`.
            - name: VLLM_UPSTREAMS
              value: ""
            # Catalog globs for models called directly at a vendor's own API
            # (class external_api: prompts leave the cluster AND the cloud
            # account). Owned by `make set-anthropic-key` / `make set-openai-key`,
            # which write the darkplum-provider-config ConfigMap — a separate
            # object, so re-running deploy-platform never resets them. There is no
            # IAM allowlist below the gateway for a vendor key, so an empty filter
            # means NO vendor models, not all of them. A filter chosen in Admin >
            # Models lives in the database and is mirrored here by the api; the
            # _SET_AT stamps let the gateway use whichever was written last, so the
            # command line and the UI can never silently disagree.
            - name: ANTHROPIC_MODEL_FILTER
              valueFrom:
                configMapKeyRef:
                  name: darkplum-provider-config
                  key: ANTHROPIC_MODEL_FILTER
                  optional: true
            - name: ANTHROPIC_MODEL_FILTER_SET_AT
              valueFrom:
                configMapKeyRef:
                  name: darkplum-provider-config
                  key: ANTHROPIC_MODEL_FILTER_SET_AT
                  optional: true
            # Sent as anthropic-workspace-id on every Anthropic request. Needed
            # only for a key created at organisation level rather than inside a
            # workspace; set from Admin > Models or `make set-anthropic-key
            # WORKSPACE=...`, same last-writer rule as the filter.
            - name: ANTHROPIC_WORKSPACE_ID
              valueFrom:
                configMapKeyRef:
                  name: darkplum-provider-config
                  key: ANTHROPIC_WORKSPACE_ID
                  optional: true
            - name: OPENAI_MODEL_FILTER
              valueFrom:
                configMapKeyRef:
                  name: darkplum-provider-config
                  key: OPENAI_MODEL_FILTER
                  optional: true
            - name: OPENAI_MODEL_FILTER_SET_AT
              valueFrom:
                configMapKeyRef:
                  name: darkplum-provider-config
                  key: OPENAI_MODEL_FILTER_SET_AT
                  optional: true
            - name: PROVIDER_KEYS_DIR
              value: /var/run/darkplum/provider-keys
          volumeMounts:
            # Vendor API keys, one file per vendor (anthropic-api-key,
            # openai-api-key). A file mount, not env: the kubelet refreshes it in
            # place (~60-90s) and the gateway re-reads it, so rotating a vendor key
            # is not a rollout. The image runs as uid 65532 with no
            # securityContext; the default 0444-equivalent mode is readable.
            - name: provider-keys
              mountPath: /var/run/darkplum/provider-keys
              readOnly: true
            # Per-organisation HMAC secret (files user-hmac-key, user-hmac-key-id)
            # used to pseudonymise the OpenAI `user` field before it is sent to
            # Anthropic / Bedrock, which must never receive the raw identifier.
            # Generated at install by `make deploy-platform` and read from files
            # (USER_HMAC_DIR, default /var/run/darkplum/user-hmac), never from the
            # environment or the database. Rotation: docs/RUNBOOK-vendor-apis.md.
            - name: user-hmac
              mountPath: /var/run/darkplum/user-hmac
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        # Optional: the gateway starts, and serves self-hosted and Bedrock models,
        # whether or not any vendor key has been installed.
        - name: provider-keys
          secret:
            secretName: darkplum-provider-keys
            optional: true
        # Optional: without it the gateway starts and serves normally, and the
        # `user` field is simply left off OpenAI, Anthropic and Bedrock requests (one
        # WARNING in the gateway log) rather than sent raw.
        - name: user-hmac
          secret:
            secretName: darkplum-user-hmac
            optional: true
