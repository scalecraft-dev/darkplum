apiVersion: apps/v1
kind: Deployment
metadata:
  name: darkplum-gateway
  namespace: darkplum-system
  labels:
    app.kubernetes.io/name: darkplum-gateway
    app.kubernetes.io/part-of: darkplum
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: darkplum-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: darkplum-gateway
        app.kubernetes.io/part-of: darkplum
    spec:
      serviceAccountName: darkplum-gateway
      containers:
        - name: gateway
          image: darkplum-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: GATEWAY_PORT
              value: "8080"
            - name: VLLM_UPSTREAM
              value: http://vllm-inference.darkplum-inference.svc.cluster.local:8000
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
            - name: BEDROCK_ENABLED
              value: "true"
            - name: BEDROCK_REGION
              value: "us-east-1"
            # Catalog globs for Bedrock models (e.g. "*.anthropic.claude-*").
            # `make deploy-platform` fills this from the Terraform
            # bedrock_model_filter output so the catalog matches the IAM
            # allowlist. Empty = list every discovered inference profile.
            - name: BEDROCK_MODEL_FILTER
              value: ""
            # Additional self-hosted vLLM backends as "name=url,name2=url2".
            # Managed by `make deploy-model` / `make remove-model`.
            - name: VLLM_UPSTREAMS
              value: ""
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
