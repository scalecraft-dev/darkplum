# The api runs as its own ServiceAccount so its one Kubernetes permission (see
# provider-rbac.yaml) is not shared with anything else in the namespace — before
# this it ran as `default`, alongside web.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: darkplum-api
  namespace: darkplum-system
  labels:
    app.kubernetes.io/name: darkplum-api
    app.kubernetes.io/part-of: darkplum
