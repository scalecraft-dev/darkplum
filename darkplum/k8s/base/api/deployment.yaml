apiVersion: apps/v1
kind: Deployment
metadata:
  name: darkplum-api
  namespace: darkplum-system
  labels:
    app.kubernetes.io/name: darkplum-api
    app.kubernetes.io/part-of: darkplum
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: darkplum-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: darkplum-api
        app.kubernetes.io/part-of: darkplum
    spec:
      # Own ServiceAccount: its single permission is patch on the two vendor-key
      # objects (provider-rbac.yaml).
      serviceAccountName: darkplum-api
      containers:
        - name: api
          image: darkplum-api:latest
          imagePullPolicy: Always  # :latest is mutable; IfNotPresent keeps a node on the old image after darkplum deploy
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: WEB_PORT
              value: "8080"
            # 80% of the memory limit below.
            - name: GOMEMLIMIT
              value: "800MiB"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL
            - name: GATEWAY_URL
              value: http://darkplum-gateway.darkplum-system.svc.cluster.local:8080
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: darkplum-auth
                  key: OIDC_ISSUER
                  optional: true
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: darkplum-auth
                  key: OIDC_CLIENT_ID
                  optional: true
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: darkplum-auth
                  key: OIDC_CLIENT_SECRET
                  optional: true
            - name: OIDC_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: darkplum-auth
                  key: OIDC_REDIRECT_URL
                  optional: true
            - name: SESSION_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: darkplum-auth
                  key: SESSION_SIGNING_KEY
            # Secret the api<->gateway service key is derived from. Separate from
            # SESSION_SIGNING_KEY so the gateway credential can be rotated without
            # logging every user out. Optional: falls back to SESSION_SIGNING_KEY.
            - name: SERVICE_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: darkplum-auth
                  key: SERVICE_KEY_SECRET
                  optional: true
            - name: SECURE_COOKIES
              valueFrom:
                secretKeyRef:
                  name: darkplum-auth
                  key: SECURE_COOKIES
                  optional: true
            # Where the optional vendor billing keys are mounted (see volumes).
            - name: BILLING_KEYS_DIR
              value: /var/run/darkplum/billing-keys
            # Where library tool (MCP server) credentials are mounted.
            - name: TOOL_CREDENTIALS_DIR
              value: /var/run/darkplum/tool-credentials
          # Keep serving while the Service stops sending here; the listener otherwise
          # closes on SIGTERM while traffic still arrives. Fits the 30s grace period,
          # with the 10s the server takes to finish what it is doing.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            # Vendor billing (admin-scope) keys, one file per vendor
            # (anthropic-billing-key, openai-billing-key). File mount so a
            # rotation needs no rollout; optional so the api starts without any.
            - name: billing-keys
              mountPath: /var/run/darkplum/billing-keys
              readOnly: true
            # Library tool credentials, one file per tool item id. Optional.
            - name: tool-credentials
              mountPath: /var/run/darkplum/tool-credentials
              readOnly: true
          # The session chat proxy re-marshals a body of up to 16 MiB a few
          # times over (system prompt, library, stored-attachment expansion),
          # so it needs a ceiling and a GOMEMLIMIT under it like the gateway.
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
      volumes:
        - name: billing-keys
          secret:
            secretName: darkplum-billing-keys
            optional: true
        - name: tool-credentials
          secret:
            secretName: darkplum-tool-credentials
            optional: true
