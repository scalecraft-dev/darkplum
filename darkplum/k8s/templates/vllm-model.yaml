# Not applied directly — rendered by `make deploy-model NAME=<instance> MODEL=<hf-id>`.
#
# One additional self-hosted open-source model: a vLLM Deployment + Service in
# darkplum-inference, named vllm-<instance>. Each instance takes one GPU, so the
# GPU node group needs a free GPU (raise gpu_desired_size in terraform.tfvars).
#
# The gateway reaches it through VLLM_UPSTREAMS ("<instance>=http://vllm-<instance>...")
# and picks up its served model on the next discovery tick. The shared
# app.kubernetes.io/component label puts it under the same gateway-only
# NetworkPolicies as the default vllm-inference deployment.
#
# Placeholders: MODEL_INSTANCE, PLACEHOLDER_MODEL_NAME, PLACEHOLDER_MODEL_REVISION,
# PLACEHOLDER_SERVED_MODEL_NAME, PLACEHOLDER_MAX_MODEL_LEN.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-MODEL_INSTANCE
  namespace: darkplum-inference
  labels:
    app.kubernetes.io/name: vllm-MODEL_INSTANCE
    app.kubernetes.io/part-of: darkplum
    app.kubernetes.io/component: inference-backend
    darkplum.ai/model-instance: MODEL_INSTANCE
spec:
  replicas: 1
  # One model per GPU: a rolling update would start the new pod before the old
  # one frees the GPU, so it stays Pending forever. Recreate stops the old pod
  # first (a short outage while the model reloads).
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-MODEL_INSTANCE
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-MODEL_INSTANCE
        app.kubernetes.io/part-of: darkplum
        app.kubernetes.io/component: inference-backend
        darkplum.ai/model-instance: MODEL_INSTANCE
    spec:
      serviceAccountName: darkplum-vllm
      # A model backend never talks to the Kubernetes API; do not hand third-party
      # model code a service-account token.
      automountServiceAccountToken: false
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        darkplum.ai/node-type: gpu-inference
      initContainers:
        - name: model-download
          image: python:3.11-slim
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -c
            - |
              pip install -q huggingface-hub && \
              hf download $(MODEL_NAME) --revision $(MODEL_REVISION) --local-dir /model
          env:
            - name: MODEL_NAME
              value: PLACEHOLDER_MODEL_NAME
            # Branch, tag or (recommended) a full commit SHA from the model's
            # Hugging Face repo, so a re-download cannot silently change weights.
            - name: MODEL_REVISION
              value: PLACEHOLDER_MODEL_REVISION
            # Gated models (Llama, Gemma, ...) need a Hugging Face token that has
            # accepted the model licence. Created with `make set-hf-token`; absent
            # for ungated models.
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: token
                  optional: true
          volumeMounts:
            - name: model-storage
              mountPath: /model
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              memory: 8Gi
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - --model
            - /model
            - --served-model-name
            - PLACEHOLDER_SERVED_MODEL_NAME
            - --port
            - "8000"
            - --max-model-len
            - "PLACEHOLDER_MAX_MODEL_LEN"
            - --gpu-memory-utilization
            - "0.90"
            # Refuse pickle-format weights (arbitrary code execution on load). Remove
            # only for a trusted model that ships no safetensors.
            - --load-format
            - safetensors
            # Never log prompts: vLLM logs every request's full prompt at INFO by default,
            # which would put prompt text in container logs (and any log shipping).
            # NOTE: --disable-log-requests is the vLLM 0.6.x spelling. Newer vLLM logs
            # request prompts only when asked (--enable-log-requests) and REMOVES this
            # flag, so it fails to start. When upgrading the image, drop this flag
            # (and confirm prompts still are not logged).
            - --disable-log-requests
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 300
            periodSeconds: 30
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 600
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: "2"
              memory: 12Gi
              nvidia.com/gpu: "1"
            limits:
              memory: 14Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-storage
              mountPath: /model
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-storage
          emptyDir:
            sizeLimit: 30Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-MODEL_INSTANCE
  namespace: darkplum-inference
  labels:
    app.kubernetes.io/name: vllm-MODEL_INSTANCE
    app.kubernetes.io/part-of: darkplum
    app.kubernetes.io/component: inference-backend
    darkplum.ai/model-instance: MODEL_INSTANCE
spec:
  # Headless: the gateway resolves the pod IP and dials it directly. A ClusterIP
  # would be matched by the VPC CNI's egress NetworkPolicy before kube-proxy
  # rewrites it to the pod IP, so the gateway-egress pod selector would not allow
  # it. clusterIP is immutable; the Makefile recreates a Service that still has one.
  clusterIP: None
  selector:
    app.kubernetes.io/name: vllm-MODEL_INSTANCE
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
