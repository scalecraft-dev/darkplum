apiVersion: apps/v1
kind: Deployment
metadata:
  name: darkplum-gateway
  namespace: darkplum-system
spec:
  template:
    spec:
      containers:
        - name: gateway
          env:
            - name: BEDROCK_ENABLED
              value: "true"
            - name: HOME
              value: /home
            # Rewritten by scripts/dev.sh from DEV_AWS_PROFILE.
            - name: AWS_PROFILE
              value: PLACEHOLDER_AWS_PROFILE
            - name: AWS_CONFIG_FILE
              value: /home/.aws/config
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /home/.aws/credentials
          volumeMounts:
            - name: aws-credentials
              mountPath: /home/.aws
              readOnly: true
      volumes:
        # /host-users/.aws on the kind node holds only the credential files the
        # scripts/dev.sh mounted (config, credentials, sso/), not the whole ~/.aws.
        - name: aws-credentials
          hostPath:
            path: /host-users/.aws
            type: Directory
