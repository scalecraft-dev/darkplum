# Dev-only: the developer's AWS credential files mounted into the api so the
# Bedrock spend reconciliation (Cost Explorer) works from a laptop. In
# production the api gets credentials from its own EKS Pod Identity role.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: darkplum-api
  namespace: darkplum-system
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: HOME
              value: /home
            # Rewritten by scripts/dev.sh from DEV_AWS_PROFILE.
            - name: AWS_PROFILE
              value: PLACEHOLDER_AWS_PROFILE
            - name: AWS_CONFIG_FILE
              value: /home/.aws/config
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /home/.aws/credentials
          volumeMounts:
            - name: aws-credentials
              mountPath: /home/.aws
              readOnly: true
      volumes:
        - name: aws-credentials
          hostPath:
            path: /host-users/.aws
            type: Directory
