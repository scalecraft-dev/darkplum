# Fixed dev-only auth secret so `kubectl apply -k overlays/dev` boots without
# provisioning a real secret. The API now requires SESSION_SIGNING_KEY and fails
# closed if it is missing or under 32 characters.
#
# DO NOT use this value outside local dev. Real deployments get a generated key
# via the Makefile (`make deploy` / `make configure-sso`), which creates the
# darkplum-auth secret with `openssl rand -base64 48`.
apiVersion: v1
kind: Secret
metadata:
  name: darkplum-auth
  namespace: darkplum-system
type: Opaque
stringData:
  SESSION_SIGNING_KEY: "dev-only-insecure-session-signing-key-do-not-use-in-prod"
  # Local dev serves over http://localhost, so session cookies can't carry the
  # Secure flag. Real deployments leave this unset (defaults to true).
  SECURE_COOKIES: "false"
