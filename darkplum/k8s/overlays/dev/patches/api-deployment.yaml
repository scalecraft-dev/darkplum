apiVersion: apps/v1
kind: Deployment
metadata:
  name: darkplum-api
  namespace: darkplum-system
spec:
  template:
    spec:
      containers:
        - name: api
          imagePullPolicy: Never
          env:
            - name: CORS_ALLOWED_ORIGINS
              value: "http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:8080"
