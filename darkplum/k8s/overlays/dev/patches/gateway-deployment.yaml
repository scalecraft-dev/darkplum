apiVersion: apps/v1
kind: Deployment
metadata:
  name: darkplum-gateway
  namespace: darkplum-system
spec:
  template:
    spec:
      containers:
        - name: gateway
          imagePullPolicy: Never
          env:
            - name: VLLM_UPSTREAM
              value: mock
            # Dev-only LM Studio backend. NOT present in the prod overlay — this
            # is the structural gate that keeps a laptop backend out of prod.
            # DEV_MODE lets the startup URL validator accept a loopback/host URL.
            - name: DEV_MODE
              value: "true"
            # Opt-in: flip to "true" and point LMSTUDIO_UPSTREAM at your machine.
            # host.docker.internal:1234 reaches LM Studio on the dev laptop from a
            # kind pod on macOS/Docker Desktop. On Linux kind it does NOT resolve
            # by default — add `--add-host=host.docker.internal:host-gateway` (or
            # use the docker bridge IP). Darkplum operates no tunnel infra;
            # reachability is the developer's responsibility.
            - name: LMSTUDIO_ENABLED
              value: "true"
            - name: LMSTUDIO_UPSTREAM
              value: http://host.docker.internal:1234
            # Bedrock is off in the default dev stack: it needs the developer's AWS
            # credentials inside the pod. `DEV_AWS=1 scripts/dev.sh up` applies the
            # dev-aws overlay, which mounts them and turns this back on.
            - name: BEDROCK_ENABLED
              value: "false"
