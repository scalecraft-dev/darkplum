# Not a Kubernetes resource — used by `kind create cluster --config`.
# The host port is rewritten by `DEV_PORT=<port> scripts/dev.sh up`. With DEV_AWS=1 the
# scripts/dev.sh appends extraMounts for the AWS credential files that exist under
# ~/.aws (config, credentials, sso/) — never the whole directory.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
