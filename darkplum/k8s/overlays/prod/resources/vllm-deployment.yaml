apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference
  namespace: darkplum-inference
  labels:
    app.kubernetes.io/name: vllm-inference
    app.kubernetes.io/part-of: darkplum
spec:
  replicas: 1
  # One model per GPU: a rolling update would start the new pod before the old
  # one frees the GPU, so it stays Pending forever. Recreate stops the old pod
  # first (a short outage while the model reloads).
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-inference
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-inference
        app.kubernetes.io/part-of: darkplum
        # Shared by every self-hosted model backend (this default one and any
        # added with `make deploy-model`). NetworkPolicies select on it.
        app.kubernetes.io/component: inference-backend
    spec:
      serviceAccountName: darkplum-vllm
      # A model backend never talks to the Kubernetes API; do not hand third-party
      # model code a service-account token.
      automountServiceAccountToken: false
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        darkplum.ai/node-type: gpu-inference
      initContainers:
        - name: model-download
          # The pinned vLLM image already ships huggingface_hub, so the download
          # needs no `pip install` at start-up and no second third-party image. Its
          # entrypoint is the API server, hence the explicit command. Runs as an
          # unprivileged user: nothing here needs root, and /model (an emptyDir) is
          # writable by anyone.
          image: vllm/vllm-openai:v0.6.6@sha256:6956052a3491118df885b37e240abebaf839b62495c3d54e617cb8401c54717b
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - python3
            - -c
            - |
              import os
              from huggingface_hub import snapshot_download
              snapshot_download(
                  repo_id=os.environ["MODEL_NAME"],
                  revision=os.environ["MODEL_REVISION"],
                  local_dir="/model",
              )
          env:
            - name: HOME
              value: /tmp
            - name: HF_HOME
              value: /tmp/hf
            - name: MODEL_NAME
              value: PLACEHOLDER_MODEL_NAME
            # Branch, tag or (recommended) a full commit SHA from the model's
            # Hugging Face repo, so a re-download cannot silently change weights.
            - name: MODEL_REVISION
              value: PLACEHOLDER_MODEL_REVISION
            # Gated models (Llama, Gemma, ...) need a Hugging Face token that has
            # accepted the model licence. Created with `make set-hf-token`; absent
            # for ungated models.
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: token
                  optional: true
          volumeMounts:
            - name: model-storage
              mountPath: /model
            - name: hf-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              memory: 8Gi
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.6@sha256:6956052a3491118df885b37e240abebaf839b62495c3d54e617cb8401c54717b
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - --model
            - /model
            - --served-model-name
            - PLACEHOLDER_SERVED_MODEL_NAME
            - --port
            - "8000"
            - --max-model-len
            - "8192"
            - --gpu-memory-utilization
            - "0.90"
            # Refuse pickle-format weights (arbitrary code execution on load). Remove
            # only for a trusted model that ships no safetensors.
            - --load-format
            - safetensors
            # Never log prompts: vLLM logs every request's full prompt at INFO by default,
            # which would put prompt text in container logs (and any log shipping).
            # NOTE: --disable-log-requests is the vLLM 0.6.x spelling. Newer vLLM logs
            # request prompts only when asked (--enable-log-requests) and REMOVES this
            # flag, so it fails to start. When upgrading the image, drop this flag
            # (and confirm prompts still are not logged).
            - --disable-log-requests
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 300
            periodSeconds: 30
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 600
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: "2"
              memory: 12Gi
              nvidia.com/gpu: "1"
            limits:
              memory: 14Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-storage
              mountPath: /model
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-storage
          emptyDir:
            sizeLimit: 30Gi
        - name: hf-tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
