apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference
  namespace: darkplum-inference
  labels:
    app.kubernetes.io/name: vllm-inference
    app.kubernetes.io/part-of: darkplum
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm-inference
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-inference
        app.kubernetes.io/part-of: darkplum
        # Shared by every self-hosted model backend (this default one and any
        # added with `make deploy-model`). NetworkPolicies select on it.
        app.kubernetes.io/component: inference-backend
    spec:
      serviceAccountName: darkplum-vllm
      # A model backend never talks to the Kubernetes API; do not hand third-party
      # model code a service-account token.
      automountServiceAccountToken: false
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        darkplum.ai/node-type: gpu-inference
      initContainers:
        - name: model-download
          image: python:3.11-slim
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -c
            - |
              pip install -q huggingface-hub && \
              hf download $(MODEL_NAME) --revision $(MODEL_REVISION) --local-dir /model
          env:
            - name: MODEL_NAME
              value: PLACEHOLDER_MODEL_NAME
            # Branch, tag or (recommended) a full commit SHA from the model's
            # Hugging Face repo, so a re-download cannot silently change weights.
            - name: MODEL_REVISION
              value: PLACEHOLDER_MODEL_REVISION
          volumeMounts:
            - name: model-storage
              mountPath: /model
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              memory: 8Gi
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - --model
            - /model
            - --served-model-name
            - PLACEHOLDER_SERVED_MODEL_NAME
            - --port
            - "8000"
            - --max-model-len
            - "8192"
            - --gpu-memory-utilization
            - "0.90"
            # Refuse pickle-format weights (arbitrary code execution on load). Remove
            # only for a trusted model that ships no safetensors.
            - --load-format
            - safetensors
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 300
            periodSeconds: 30
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 600
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: "2"
              memory: 12Gi
              nvidia.com/gpu: "1"
            limits:
              memory: 14Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-storage
              mountPath: /model
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-storage
          emptyDir:
            sizeLimit: 30Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
